   <rect x="833" y="111" width="167" height="124" rx="12" fill="#453821" stroke="#d3b762"/><text x="916" y="155" text-anchor="middle" fill="#ffebbb" font-weight="700" font-size="18">Gold</text><text x="916" y="182" text-anchor="middle" fill="#ebddab" font-size="13">Curated</text><text x="916" y="201" text-anchor="middle" fill="#ebddab" font-size="13">analytics fields</text>
