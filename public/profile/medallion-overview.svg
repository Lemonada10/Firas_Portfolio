<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="338" viewBox="0 0 1400 338" role="img" aria-labelledby="title desc">
<title id="title">Illustrative medallion data pipeline</title>
<desc id="desc">Sources flow through landing, bronze, silver, gold and platinum layers into reporting.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091727"/><stop offset="1" stop-color="#102a3c"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#47d9ca"/><stop offset="1" stop-color="#80a8ff"/></linearGradient>
