   <rect x="1233" y="111" width="134" height="124" rx="12" fill="#173c39" stroke="#49bcaa"/><text x="1300" y="155" text-anchor="middle" fill="#e0fff0" font-weight="700" font-size="18">Reporting</text><text x="1300" y="182" text-anchor="middle" fill="#c0e3d9" font-size="13">Power BI</text><text x="1300" y="201" text-anchor="middle" fill="#c0e3d9" font-size="13">KPI analysis</text>
