</defs>
<rect width="1400" height="338" rx="18" fill="url(#back)"/>
<text x="37" y="47" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#fff">From fragmented inputs to analytics-ready datasets</text>
<text x="37" y="77" font-family="Arial,sans-serif" font-size="14" fill="#a4becc">Conceptual example based on common medallion design patterns · Not a reproduction of employer systems</text>
