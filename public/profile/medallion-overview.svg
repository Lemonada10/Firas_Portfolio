   <rect x="233" y="111" width="167" height="124" rx="12" fill="#123345" stroke="#359c9a"/><text x="316" y="155" text-anchor="middle" fill="#e2ffff" font-weight="700" font-size="18">Landing</text><text x="316" y="182" text-anchor="middle" fill="#adcfdf" font-size="13">Acquire and</text><text x="316" y="201" text-anchor="middle" fill="#adcfdf" font-size="13">preserve inputs</text>
   <rect x="433" y="111" width="167" height="124" rx="12" fill="#3a2d26" stroke="#ca8950"/><text x="516" y="155" text-anchor="middle" fill="#ffdfbe" font-weight="700" font-size="18">Bronze</text><text x="516" y="182" text-anchor="middle" fill="#dfc6aa" font-size="13">Standard file</text><text x="516" y="201" text-anchor="middle" fill="#dfc6aa" font-size="13">formats · Parquet</text>
